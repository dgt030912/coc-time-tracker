<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Village Upgrade Timers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* Look: cartoon village. Grass field, wooden bars, parchment panels, chunky outlined type and
     raised buttons. Resource colors: gold (builders), elixir (lab), dark elixir (pets). */
  :root {
    --grass-1: #4f9a31; --grass-2: #2f6a1f; --grass-3: #214d16;
    --wood: #8a5427; --wood-l: #b5753d; --wood-d: #4b2a12;
    --parch: #fbf1d8; --parch-2: #f1e2bd; --parch-3: #e5d09f; --line: #d3b980;
    --ink: #3b2614; --ink-soft: #7d6347;
    --gold: #ffd23f; --gold-d: #c88a06;
    --elixir: #d651ec; --elixir-d: #8b22a3;
    --dark: #6b4f97; --dark-d: #34224f;
    --green: #8fdc41; --green-d: #3e8a12;
    --red: #ff6a52; --red-d: #a92a17;
    --stone: #d9d3c6; --stone-d: #8f887a;
    --builder: #f5a623; --lab: #c94fe4; --pet: #7a5bb3; --bb: #2fb6c8;
    --done: #3fa31f;
    --muted: var(--ink-soft);
    --radius: 18px;
    --display: 'Lilita One', 'Arial Rounded MT Bold', system-ui, sans-serif;
    --body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --outline: -1.5px -1.5px 0 var(--wood-d), 1.5px -1.5px 0 var(--wood-d), -1.5px 1.5px 0 var(--wood-d), 1.5px 1.5px 0 var(--wood-d), 0 3px 0 var(--wood-d);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { background: var(--grass-3); }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 600 15px/1.45 var(--body);
    background:
      radial-gradient(ellipse 900px 420px at 50% -120px, #c8f08a55, transparent 70%),
      radial-gradient(circle at 20% 30%, #ffffff0a 0 2px, transparent 3px) 0 0 / 46px 46px,
      radial-gradient(circle at 70% 60%, #00000014 0 2px, transparent 3px) 0 0 / 38px 38px,
      linear-gradient(180deg, var(--grass-1), var(--grass-2) 55%, var(--grass-3));
    background-attachment: fixed;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
  main.wrap { padding-top: 22px; padding-bottom: 64px; }

  /* top bar: a wooden plank */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    background:
      repeating-linear-gradient(90deg, #ffffff0d 0 2px, transparent 2px 64px),
      repeating-linear-gradient(0deg, #0000000d 0 1px, transparent 1px 7px),
      linear-gradient(180deg, var(--wood-l), var(--wood));
    border-bottom: 4px solid var(--wood-d); box-shadow: 0 5px 0 #0000003d;
  }
  .topbar-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-top: 10px; padding-bottom: 10px; }
  .logo { margin: 0; font: 400 28px/1 var(--display); letter-spacing: .5px; color: #fff; text-shadow: var(--outline); white-space: nowrap; }
  .logo b { font-weight: 400; color: var(--gold); }
  .topbar .meta, .topbar .who { color: #fde9c8; font-size: 13px; }
  .who { font-family: var(--display); font-size: 15px !important; color: #fff !important; text-shadow: var(--outline); }

  h2 { margin: 0; }
  .ptitle {
    display: inline-block; margin: 0 0 14px; padding: 4px 16px 5px; border-radius: 12px;
    font: 400 18px/1.2 var(--display); letter-spacing: .4px; color: #fff; text-shadow: var(--outline);
    background: linear-gradient(180deg, var(--wood-l), var(--wood)); border: 3px solid var(--wood-d); box-shadow: 0 3px 0 var(--wood-d);
  }
  .phead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
  .phead .ptitle { margin-bottom: 0; }
  .meta { color: var(--ink-soft); font-size: 13px; }
  .warn { color: var(--red-d); }
  b { font-weight: 800; }

  section.panel {
    background: linear-gradient(180deg, var(--parch), var(--parch-2));
    border: 4px solid var(--wood-d); border-radius: var(--radius); padding: 16px;
    margin-bottom: 18px; box-shadow: inset 0 0 0 3px var(--parch-3), 0 6px 0 #0000004d;
  }

  /* chunky raised buttons (stone by default) */
  button {
    font: 400 14px/1.1 var(--display); letter-spacing: .4px; color: #fff; text-shadow: var(--outline);
    background: linear-gradient(180deg, #f1ece2, var(--stone) 45%, var(--stone-d));
    border: 3px solid var(--wood-d); border-radius: 12px; padding: 7px 14px 8px;
    box-shadow: inset 0 2px 0 #ffffff8c, 0 4px 0 var(--wood-d); cursor: pointer; white-space: nowrap;
    transition: transform .05s, box-shadow .05s, filter .1s;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(3px); box-shadow: inset 0 2px 0 #ffffff8c, 0 1px 0 var(--wood-d); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  button.primary { background: linear-gradient(180deg, #fff3a3, var(--gold) 45%, #f0a915); }
  button.go { background: linear-gradient(180deg, #d9ffa6, var(--green) 45%, #4fa61c); }
  button.danger { background: linear-gradient(180deg, #ffc3b5, var(--red) 45%, #d63a22); }
  button.ghost {
    color: var(--ink); text-shadow: none; font-family: var(--body); font-weight: 800; font-size: 13px;
    background: linear-gradient(180deg, #fffaf0, var(--parch-2)); border-color: var(--line); box-shadow: 0 3px 0 var(--line);
  }
  button.ghost:active { box-shadow: 0 1px 0 var(--line); }
  button.sm { padding: 4px 10px 5px; font-size: 13px; border-radius: 10px; }
  button.x { padding: 0 6px; color: var(--ink-soft); background: none; border: none; box-shadow: none; text-shadow: none; font-size: 18px; }
  .topbar button.ghost { background: linear-gradient(180deg, #fff3dc, #ecd3a4); border-color: var(--wood-d); box-shadow: 0 3px 0 var(--wood-d); }

  select, input.dur, .plan input[type=number], textarea {
    font: 700 14px var(--body); color: var(--ink); background: #fffdf6;
    border: 2px solid var(--line); border-radius: 10px; padding: 6px 9px; box-shadow: inset 0 2px 0 #0000000d;
  }
  select { cursor: pointer; }
  input.dur { width: 120px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .err { color: var(--red-d); font-size: 13px; margin-top: 8px; font-weight: 800; }

  /* village tabs: wooden signs */
  .vtabs { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 10px; margin-bottom: 8px; scrollbar-width: thin; }
  .vtab {
    display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 140px; text-align: left; flex: none;
    padding: 8px 14px 9px; border-radius: 14px; color: #fff;
    background: linear-gradient(180deg, var(--wood-l), var(--wood)); box-shadow: inset 0 2px 0 #ffffff33, 0 4px 0 var(--wood-d);
    border-left: 8px solid var(--c, var(--gold));
  }
  .vtab .t { font: 400 16px/1.1 var(--display); text-shadow: var(--outline); }
  .vtab .s { font: 700 11px var(--body); color: #fde9c8; text-shadow: none; }
  .vtab.on { background: linear-gradient(180deg, #fff3a3, var(--gold) 50%, #f0a915); }
  .vtab.on .s { color: var(--wood-d); }

  /* summary cards: parchment with a colored banner */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .card {
    position: relative; padding: 0 0 12px; overflow: hidden;
    background: var(--parch); border: 4px solid var(--wood-d); border-radius: var(--radius); box-shadow: 0 6px 0 #0000004d;
  }
  .card .lbl {
    padding: 6px 14px 7px; font: 400 16px/1.2 var(--display); letter-spacing: .4px; color: #fff; text-shadow: var(--outline);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); border-bottom: 3px solid var(--wood-d);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .big { padding: 8px 14px 0; font: 400 28px/1.1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .card .sub { padding: 2px 14px 0; font-size: 12px; color: var(--ink-soft); }
  .card .achips { padding: 8px 14px 0; }
  .card.click { cursor: pointer; transition: transform .1s; }
  .card.click:hover { transform: translateY(-2px); }

  /* village header */
  .vhead {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px;
    padding: 10px 14px; border-radius: var(--radius); background: #00000033; border: 3px solid #00000040;
  }
  .vhead .t { font: 400 26px/1.1 var(--display); color: #fff; text-shadow: var(--outline); }
  .vhead .t small { font: 700 13px var(--body); color: #e9f7d8; text-shadow: none; margin-left: 8px; }
  .vhead .meta { color: #e9f7d8; }
  .nick { cursor: pointer; }
  .pen { opacity: .55; font-size: .7em; margin-left: 6px; }
  .nick:hover .pen { opacity: 1; }
  .vboosts { margin: 0 0 16px; }
  .vboosts .meta { color: #e9f7d8; }

  /* active boost chips */
  .achips { display: flex; flex-wrap: wrap; gap: 6px; }
  .achip {
    font: 800 12px var(--body); padding: 2px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; color: #fff;
    background: var(--c); border: 2px solid var(--wood-d); box-shadow: 0 2px 0 var(--wood-d); text-shadow: 0 1px 0 #0006;
  }

  /* filters */
  .filters { display: grid; gap: 10px; margin-bottom: 14px; padding: 12px; border-radius: 14px; background: var(--parch-3); border: 2px solid var(--line); }
  .frow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .flabel { font: 400 14px var(--display); color: var(--wood); min-width: 66px; letter-spacing: .3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font: 800 13px var(--body); color: var(--ink); text-shadow: none; padding: 5px 12px; border-radius: 999px;
    background: #fffaf0; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line);
  }
  .chip .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); margin-right: 6px; border: 1px solid var(--wood-d); }
  .chip.on { background: linear-gradient(180deg, #fff3a3, var(--gold)); border-color: var(--gold-d); box-shadow: 0 3px 0 var(--gold-d); }
  .ctl label { font: 400 14px var(--display); color: var(--wood); margin-right: 6px; }
  .ctl .meta { margin-left: auto; }

  /* upgrade rows */
  .group-h {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin: 18px 0 6px; padding: 4px 12px;
    border-radius: 10px; font: 400 17px var(--display); color: #fff; text-shadow: var(--outline);
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c)); border: 3px solid var(--wood-d);
  }
  .group-h:first-child { margin-top: 0; }
  .group-h .meta { font: 700 12px var(--body); color: #fff; text-shadow: 0 1px 0 #0007; }
  .timer {
    display: grid; grid-template-columns: 46px 1fr auto; gap: 0 12px; align-items: center;
    padding: 9px 12px; margin-bottom: 8px; border-radius: 14px; background: #fffaf0; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line);
  }
  .timer .bar {
    width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 65%, #fff), var(--c)); border: 3px solid var(--wood-d); box-shadow: 0 3px 0 var(--wood-d);
  }
  .timer .nm { font: 400 17px/1.2 var(--display); color: var(--ink); cursor: pointer; letter-spacing: .2px; }
  .timer .nm:hover { text-decoration: underline dotted; }
  .timer .info { font-size: 12px; color: var(--ink-soft); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .lvl { font: 400 13px var(--display); color: var(--wood); }
  .badge { font: 800 11px var(--body); padding: 1px 8px; border-radius: 999px; border: 2px solid var(--line); color: var(--ink-soft); background: var(--parch); }
  .badge.q { color: var(--ink); border-color: color-mix(in srgb, var(--c) 60%, var(--line)); background: color-mix(in srgb, var(--c) 18%, #fff); }
  .badge.v { color: #fff; background: var(--vc); border-color: var(--wood-d); text-shadow: 0 1px 0 #0007; }
  .badge.boost { color: var(--done); border-color: color-mix(in srgb, var(--done) 50%, var(--line)); background: #effbe6; }
  .timer .right { text-align: right; }
  .timer .cd {
    display: inline-block; min-width: 110px; text-align: center; padding: 4px 12px 5px; border-radius: 10px;
    font: 400 20px/1.1 var(--display); color: #fff; letter-spacing: .3px; font-variant-numeric: tabular-nums;
    background: linear-gradient(180deg, #5a4028, #3b2614); border: 2px solid var(--wood-d); text-shadow: 0 2px 0 #000;
  }
  .timer .fin { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .timer.done { background: #f0fbe6; border-color: #b9e09a; box-shadow: 0 3px 0 #b9e09a; }
  .timer.done .cd { background: linear-gradient(180deg, #a6ec62, #4fa61c); border-color: var(--green-d); text-shadow: var(--outline); }
  .empty { color: var(--ink-soft); font-size: 14px; padding: 6px 2px 10px; }

  /* boosts */
  .bgroup { font: 400 15px var(--display); color: var(--wood); margin: 14px 0 6px; letter-spacing: .3px; }
  .bgroup:first-child { margin-top: 4px; }
  .brow {
    display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(170px, 1fr) minmax(300px, auto); gap: 6px 14px; align-items: center;
    padding: 9px 12px; margin-bottom: 6px; border-radius: 12px; background: #fffaf0; border: 2px solid var(--line); border-left: 8px solid var(--line);
  }
  .brow.on { border-left-color: var(--c); background: color-mix(in srgb, var(--c) 10%, #fffaf0); }
  .brow .bn { font: 400 16px var(--display); }
  .brow .bd { font-size: 12px; color: var(--ink-soft); }
  .bs { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .bs.on { color: var(--done); font-weight: 800; }
  .bs .src { font-size: 11px; border: 2px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 4px; color: var(--ink-soft); font-weight: 800; }
  .bc { justify-content: flex-end; }
  .expmap { margin-top: 14px; padding-top: 12px; border-top: 2px dashed var(--line); font-size: 13px; }
  .expmap .row { margin-top: 6px; }
  code { font: 12px ui-monospace, Menlo, monospace; background: #fffdf6; border: 1px solid var(--line); padding: 1px 5px; border-radius: 5px; }
  label.tog { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; font-weight: 800; }
  label.tog input { accent-color: var(--green-d); width: 18px; height: 18px; }
  .hint { color: var(--ink-soft); font-size: 12px; margin-top: 8px; }

  /* planner */
  .plan { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .plan input[type=number] { width: 70px; }
  .plan-out { margin-top: 12px; font-size: 15px; }
  .plan-out b { font: 400 18px var(--display); color: var(--wood); font-variant-numeric: tabular-nums; }

  /* save status + toast */
  .sync { font: 800 12px var(--body); color: #fde9c8; }
  .sync.ok::before { content: '● '; color: var(--green); }
  .sync.bad { color: #ffd0c6; cursor: help; }
  .sync.bad::before { content: '● '; color: var(--red); }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 24px); opacity: 0; pointer-events: none; z-index: 20;
    max-width: calc(100% - 32px); padding: 10px 18px; border-radius: 14px;
    font: 400 16px var(--display); letter-spacing: .3px; color: #fff; text-shadow: var(--outline);
    background: linear-gradient(180deg, var(--wood-l), var(--wood)); border: 3px solid var(--wood-d); box-shadow: 0 5px 0 #0000004d;
    transition: .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: linear-gradient(180deg, #ff9a86, var(--red-d)); }

  @media (max-width: 760px) {
    .brow { grid-template-columns: 1fr; }
    .bc { justify-content: flex-start; }
  }
  @media (max-width: 560px) {
    .topbar { position: static; }
    .topbar-in { flex-wrap: nowrap; padding-top: 8px; padding-bottom: 8px; }
    .topbar .row { flex-wrap: nowrap; gap: 6px; }
    .logo { font-size: 19px; }
    .topbar .meta, .who { display: none; }
    .topbar-in { gap: 8px; }
    #logout { padding: 4px 8px; font-size: 12px; }
    .sync { font-size: 0; } /* keep just the dot */
    .sync::before { font-size: 14px; }
    #repaste { padding: 6px 10px; font-size: 13px; }
    main.wrap { padding-top: 14px; }
    .summary { grid-template-columns: 1fr 1fr; gap: 10px; }
    .card .lbl { font-size: 14px; padding: 5px 10px; }
    .card .big { font-size: 19px; padding: 6px 10px 0; }
    .card .sub { font-size: 11px; padding: 2px 10px 0; }
    .card .achips { padding: 6px 10px 0; }
    .vtab { min-width: 118px; padding: 6px 11px 7px; }
    section.panel { padding: 12px; }
    .timer { grid-template-columns: 40px 1fr; }
    .timer .bar { width: 40px; height: 40px; font-size: 19px; }
    .timer .right { grid-column: 2; text-align: left; margin-top: 6px; }
    .ctl .meta { margin-left: 0; width: 100%; }
    .flabel { min-width: 0; width: 100%; }
    .vhead .t { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<header class="topbar">
  <div class="wrap topbar-in">
    <h1 class="logo">Upgrade <b>Timers</b></h1>
    <div class="row">
      <span class="meta" id="meta"></span>
      <span class="sync" id="sync"></span>
      <button class="primary" id="repaste">+ Paste export</button>
      <span class="who" id="who"></span>
      <button class="ghost sm" id="logout">Sign out</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel" id="pastePanel" hidden>
    <h2 class="ptitle">Paste village export</h2>
    <textarea id="raw" placeholder='Paste the export here: {"tag":"#...","timestamp":...,"buildings":[...]}' spellcheck="false"></textarea>
    <div class="row" style="margin-top:12px">
      <button class="go" id="loadBtn">Load export</button>
      <button class="ghost" id="cancelPaste">Cancel</button>
      <span class="meta">Matched to its village by player tag: a known tag updates that village, a new tag adds one.</span>
    </div>
    <div class="err" id="err"></div>
  </section>

  <div id="app" hidden>
    <nav class="vtabs" id="vtabs"></nav>
    <div id="vhead"></div>
    <div class="summary" id="summary"></div>

    <section class="panel">
      <h2 class="ptitle" id="timersTitle">Upgrades in progress</h2>
      <div class="filters">
        <div class="frow" id="vfilterRow"><span class="flabel">Villages</span><div class="chips" id="vchips"></div></div>
        <div class="frow"><span class="flabel">Show</span><div class="chips" id="chips"></div></div>
        <div class="frow ctl">
          <span id="groupCtl"><label for="groupBy">Group</label>
            <select id="groupBy">
              <option value="none">No grouping</option>
              <option value="village">By village</option>
              <option value="queue">By queue</option>
            </select></span>
          <span><label for="sortBy">Sort</label>
            <select id="sortBy">
              <option value="soonest">Finishing soonest</option>
              <option value="latest">Finishing latest</option>
              <option value="recent" data-multi>Newest export first</option>
              <option value="village" data-multi>Village A–Z</option>
              <option value="name">Upgrade A–Z</option>
            </select></span>
          <span class="meta" id="showing"></span>
        </div>
      </div>
      <div id="timers"></div>
    </section>

    <section class="panel" id="boostPanel">
      <div class="phead">
        <h2 class="ptitle">Boosts</h2>
        <button class="ghost sm" id="boostToggle" aria-expanded="false">Manage boosts ▾</button>
      </div>
      <div id="boosts" hidden></div>
    </section>

    <section class="panel" id="plannerPanel">
      <h2 class="ptitle">Planner</h2>
      <div class="plan">
        <span>If I start a</span>
        <select id="pq">
          <option value="builder">builder</option>
          <option value="lab">lab</option>
          <option value="pet">pet</option>
        </select>
        <span>upgrade now with a base time of</span>
        <input type="number" id="pd" min="0" value="0" aria-label="days"> d
        <input type="number" id="ph" min="0" value="0" aria-label="hours"> h
        <input type="number" id="pm" min="0" value="0" aria-label="minutes"> m
      </div>
      <div class="plan-out" id="planOut"></div>
      <div class="hint">Uses this village’s active boosts and time cuts.</div>
    </section>
  </div>
</main>

<script>
const HOUR = 3600;
const QUEUES = {
  builder:    { label: 'Builders',     icon: '🔨', color: 'var(--builder)' },
  lab:        { label: 'Laboratory',   icon: '⚗️', color: 'var(--lab)' },
  pet:        { label: 'Pet House',    icon: '🐾', color: 'var(--pet)' },
  bb_builder: { label: 'Builder Base', icon: '🛠️', color: 'var(--bb)' },
  bb_lab:     { label: 'Star Lab',     icon: '🔭', color: 'var(--bb)' },
  other:      { label: 'Other',        icon: '⏳', color: 'var(--stone-d)' },
};
const HOME_QUEUES = ['builder', 'lab', 'pet'];

// Speed boosts (mult) run for a limited time and add up per queue: potion 10 + byte 4 = 14×.
// Cuts multiply an upgrade's duration when it starts.
const BOOSTS = {
  potion:       { label: 'Builder Potion',  short: 'Potion',  queue: 'builder', mult: 10, desc: '10× builder speed' },
  byte:         { label: 'Builder Byte',    short: 'Byte',    queue: 'builder', mult: 4,  desc: '4× builder speed' },
  lab_potion:   { label: 'Research Potion', short: 'Research Potion', queue: 'lab', mult: 24, desc: '24× research speed' },
  study_soup:   { label: 'Study Soup',      short: 'Study Soup', queue: 'lab',  mult: 4,  desc: '4× research speed' },
  pet_potion:   { label: 'Pet Potion',      short: 'Pet Potion', queue: 'pet',  mult: 24, desc: '24× pet speed' },
  welcome_back: { label: 'Welcome Back',    short: 'Welcome Back', cut: { builder: .5, lab: .5, pet: .5 }, desc: '−50% builder, lab and pet time' },
  hammer_jam:   { label: 'Hammer Jam',      short: 'Hammer Jam',   cut: { builder: .5 }, desc: '−50% builder time and cost' },
  gold_pass:    { label: 'Gold Pass',       short: 'Gold Pass',    cut: { builder: .8, lab: .8, pet: .8 }, desc: '−20% builder, lab and pet time' },
};
const BOOST_GROUPS = [
  ['Builders', ['potion', 'byte']],
  ['Laboratory', ['lab_potion', 'study_soup']],
  ['Pet House', ['pet_potion']],
  ['Time cuts', ['welcome_back', 'hammer_jam', 'gold_pass']],
];
const boostColor = k => BOOSTS[k].queue ? QUEUES[BOOSTS[k].queue].color : 'var(--gold)';

const SECTION_QUEUE = {
  buildings: 'builder', traps: 'builder', heroes: 'builder',
  buildings2: 'bb_builder', traps2: 'bb_builder', heroes2: 'bb_builder',
  units: 'lab', spells: 'lab', siege_machines: 'lab',
  units2: 'bb_lab', pets: 'pet',
};
const VILLAGE_COLORS = ['#e8a317', '#3a9fe0', '#e0508a', '#5cb82e', '#9b5de5', '#ef7d22', '#20b5a0', '#d9443a'];

// Data ID -> in-game name, loaded from game-names.json (ClashKing static data; see NOTICE).
// Item names you set by clicking override these.
let NAMES = {};

const $ = id => document.getElementById(id);
const now = () => Date.now() / 1000;
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

// ---------- state ----------
// Villages and item names live on the server (per user) so every device sees the same data.
// state.villages[tag] = { tag, nick, raw, color, boosts: [{id, kind, start, end|null, src, key?}], exportMap{}, applyCurrent, updatedAt, schema }
// View preferences (tab, filter, grouping, sort) stay per device in localStorage.
const PREFS_KEY = 'coc-prefs-v1';
let state = { villages: {}, names: {}, view: 'all', filter: 'all', vfilter: [], groupBy: 'none', sort: 'soonest', boostsOpen: false };
try { Object.assign(state, JSON.parse(localStorage.getItem(PREFS_KEY)) || {}); } catch (e) {}
let parsed = {}; // tag -> parsed export (cache)

function save() {
  const { view, filter, vfilter, groupBy, sort, boostsOpen } = state;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ view, filter, vfilter, groupBy, sort, boostsOpen })); } catch (e) {}
}

const villages = () => Object.values(state.villages);
const vname = v => v.nick || v.tag;
function P(v) { return parsed[v.tag] || (parsed[v.tag] = parseExport(v.raw, v.loadedAt)); }

// ---------- server ----------
let pending = 0;
async function api(method, url, body) {
  pending++;
  try {
    const r = await fetch(url, {
      method, credentials: 'same-origin',
      headers: body !== undefined ? { 'Content-Type': 'application/json' } : {},
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
    if (r.status === 401) { location.href = '/login'; throw new Error('Signed out'); }
    if (!r.ok) {
      const e = new Error((await r.json().catch(() => ({}))).error || r.statusText || `HTTP ${r.status}`);
      e.status = r.status;
      throw e;
    }
    return await r.json();
  } finally { pending--; }
}
// Every change is written to the server; the header shows whether it landed.
let writes = 0, lastSyncError = '';
function setSync() {
  const el = $('sync');
  if (writes) { el.textContent = 'Saving…'; el.className = 'sync'; }
  else if (lastSyncError) { el.textContent = 'Not saved'; el.title = lastSyncError; el.className = 'sync bad'; }
  else { el.textContent = 'Saved to account'; el.title = 'Everything is stored on the server and shows on every device'; el.className = 'sync ok'; }
}
// `gen` bumps on every local change, so a background pull that overlapped one is thrown away
// instead of wiping the change off the screen.
let gen = 0;
function write(method, url, body) {
  gen++; writes++; setSync();
  return api(method, url, body)
    .then(() => { lastSyncError = ''; })
    .catch(e => { lastSyncError = e.message; toast('Not saved: ' + e.message, true); })
    .finally(() => { writes--; setSync(); });
}
// Village saves run one at a time per village and carry the revision they're based on. If another
// device saved in between, the server answers 409: we reload its version and either redo the action
// (onConflict) or ask the user to.
const villageQueue = {};
function syncVillage(v, onConflict) {
  gen++; writes++; setSync();
  v.updatedAt = now();
  const tag = v.tag;
  const run = async () => {
    try {
      const cur = state.villages[tag];
      if (!cur) return; // removed meanwhile
      const r = await api('PUT', `/api/villages/${encodeURIComponent(tag)}`, cur);
      if (state.villages[tag]) state.villages[tag].rev = r.rev;
      lastSyncError = '';
    } catch (e) {
      if (e.status === 409) {
        // Take the server's copy of just this village; other villages keep any edits still saving.
        const d = await api('GET', '/api/state').catch(() => null);
        if (d) {
          if (d.villages && d.villages[tag]) state.villages[tag] = d.villages[tag]; else delete state.villages[tag];
          delete parsed[tag];
        }
        render();
        if (onConflict) onConflict();
        else toast(`${vname(v)} was changed on another device. Showing the latest version, so redo your change.`, true);
      } else {
        lastSyncError = e.message; toast('Not saved: ' + e.message, true);
      }
    } finally { writes--; setSync(); }
  };
  return (villageQueue[tag] = (villageQueue[tag] || Promise.resolve()).then(run));
}
function syncRemove(tag) { return write('DELETE', `/api/villages/${encodeURIComponent(tag)}`); }
function syncName(k, val) {
  return val ? write('PUT', `/api/names/${encodeURIComponent(k)}`, { name: val }) : write('DELETE', `/api/names/${encodeURIComponent(k)}`);
}

// The server reports which build of the app it runs; a tab left open across a deploy reloads itself
// so no device keeps running old code.
let appVersion = null;
function checkVersion(v) {
  if (!v) return;
  if (appVersion && v !== appVersion) { if (!writes) location.reload(); return; } // retried on the next pull
  appVersion = v;
}

// Returns false (and changes nothing) if a local edit happened while the request was out.
async function pull(force) {
  const g = gen;
  const d = await api('GET', '/api/state');
  checkVersion(d.version);
  if (!force && (g !== gen || writes)) return false;
  state.villages = d.villages || {};
  state.names = d.names || {};
  parsed = {};
  for (const v of villages()) {
    try { P(v); } catch (e) { delete state.villages[v.tag]; continue; }
    if (!/^#[0-9a-f]{6}$/i.test(v.color || '')) v.color = VILLAGE_COLORS[villages().indexOf(v) % VILLAGE_COLORS.length];
    if (normalizeVillage(v)) syncVillage(v);
  }
  return true;
}

// Bring villages saved by earlier versions (boost list + on/off toggles) into the current shape.
function normalizeVillage(v) {
  if (v.schema === 3) return false;
  const t = now(), out = [];
  for (const b of v.boosts || []) {
    if (BOOSTS[b.kind]) out.push({ id: b.id || uid(), kind: b.kind, start: b.start, end: b.end ?? b.start + HOUR, src: 'manual' });
  }
  const m = v.mods || {};
  if (m.wb) out.push({ id: uid(), kind: 'welcome_back', start: t, end: null, src: 'manual' });
  if (m.hj) out.push({ id: uid(), kind: 'hammer_jam', start: t, end: null, src: 'manual' });
  if (m.gp) out.push({ id: uid(), kind: 'gold_pass', start: t, end: null, src: 'manual' });
  v.boosts = out;
  v.exportMap = v.exportMap || v.exportKinds || {};
  v.applyCurrent = !!(v.applyCurrent || m.applyCurrent);
  delete v.mods; delete v.exportKinds;
  v.schema = 3;
  applyExport(v);
  return true;
}

// Villages the pre-login version saved only in this browser get merged into the account: any village
// the account doesn't have, or has an older export of, is uploaded. Runs on every sign-in until done.
async function migrateLocal() {
  let old;
  try { old = JSON.parse(localStorage.getItem('coc-timers-v2')); } catch (e) {}
  if (!old || !old.villages) return;
  const exportTs = v => { try { return parseExport(v.raw).ts; } catch (e) { return -1; } };
  let moved = 0, failed = 0;
  for (const v of Object.values(old.villages)) {
    if (!v || typeof v.raw !== 'string' || exportTs(v) < 0) continue;
    v.tag = parseExport(v.raw).tag;
    const mine = state.villages[v.tag];
    if (mine && exportTs(mine) >= exportTs(v)) continue;
    try { await api('PUT', `/api/villages/${encodeURIComponent(v.tag)}`, { ...v, tag: v.tag, rev: mine ? mine.rev || 0 : 0 }); moved++; } catch (e) { failed++; }
  }
  for (const [k, n] of Object.entries(old.names || {})) {
    if (!state.names[k]) await api('PUT', `/api/names/${encodeURIComponent(k)}`, { name: n }).catch(() => { failed++; });
  }
  if (failed) { toast(`Could not move ${failed} item(s) saved in this browser; will retry next time`, true); return; }
  try { localStorage.removeItem('coc-timers-v2'); } catch (e) {}
  if (moved) {
    await pull();
    toast(`Added ${moved} village${moved > 1 ? 's' : ''} saved in this browser to your account`);
  }
}

// ---------- parsing ----------
// Everything from the export is treated as untrusted: numbers are coerced, the tag must look like a
// real player tag, and nothing from it reaches the page unescaped.
// fallbackTs: when the export has no timestamp, the time it was pasted (stored on the village).
function parseExport(raw, fallbackTs) {
  const obj = JSON.parse(raw);
  if (typeof obj !== 'object' || !obj || Array.isArray(obj)) throw new Error('Not a JSON object');
  const tag = ['string', 'number'].includes(typeof obj.tag) ? String(obj.tag).trim().toUpperCase() : '';
  if (!/^#[0-9A-Z]{3,15}$/.test(tag)) throw new Error('No player tag found (like "#YYVYYYV0L"). Is this a village export?');
  let ts = Number(obj.timestamp);
  if (ts > 1e12) ts /= 1000; // milliseconds
  const hasTs = Number.isFinite(ts) && ts > 0;
  if (!hasTs) ts = fallbackTs || Math.floor(now());
  const tasks = [];
  for (const [section, arr] of Object.entries(obj)) {
    if (!Array.isArray(arr)) continue;
    arr.forEach((it, idx) => {
      if (!it || typeof it !== 'object') return;
      const timer = Number(it.timer), id = Number(it.data), lvl = Number(it.lvl);
      if (!(timer > 0) || !Number.isFinite(timer) || !Number.isFinite(id)) return;
      tasks.push({
        key: `${section}:${id}:${idx}`,
        nameKey: `${section}:${id}`,
        section, id, lvl: Number.isFinite(lvl) ? lvl : 0, timer,
        queue: SECTION_QUEUE[section] || 'other',
        extra: !!it.extra,
      });
    });
  }
  const boosts = {};
  if (obj.boosts && typeof obj.boosts === 'object' && !Array.isArray(obj.boosts)) {
    for (const [k, val] of Object.entries(obj.boosts)) if (Number.isFinite(Number(val))) boosts[k] = Number(val);
  }
  return { tag, ts, tasks, boosts, hasTs };
}

// ---------- boosts ----------
const isActive = (b, t) => b.start <= t && (b.end == null || t < b.end);
const boostOf = (v, kind) => v.boosts.find(b => b.kind === kind);
const activeBoosts = (v, t = now()) => v.boosts.filter(b => BOOSTS[b.kind] && isActive(b, t));

function defaultExportKind(key) {
  return /builder/i.test(key) ? 'potion' : /lab|research/i.test(key) ? 'lab_potion' : /pet/i.test(key) ? 'pet_potion' : 'ignore';
}
const exportKindsFor = m => m === 'ignore' ? [] : m === 'both' ? ['potion', 'byte'] : [m];
// Export boost entries: value = seconds left at export time.
function exportEntries(v) {
  return Object.entries(P(v).boosts)
    .filter(([, left]) => typeof left === 'number' && left > 0)
    .map(([key, left]) => ({ key, left, map: v.exportMap[key] || defaultExportKind(key) }));
}

// A boost with `left` seconds remaining as of `ref`. One-hour boosts that show less than an hour left
// started before `ref`, which matters for timers counted from the export time.
function makeBoost(kind, left, ref, src, key) {
  const end = left == null ? null : ref + left;
  const start = BOOSTS[kind].mult && end != null ? Math.min(ref, end - HOUR) : ref;
  return { id: uid(), kind, start, end, src, ...(key ? { key } : {}) };
}

// Read boost times from the export file, overwriting whatever is set for the same boost.
function applyExport(v, onlyKey) {
  const d = P(v);
  for (const e of exportEntries(v)) {
    if (onlyKey && e.key !== onlyKey) continue;
    v.boosts = v.boosts.filter(b => b.key !== e.key);
    for (const kind of exportKindsFor(e.map)) {
      v.boosts = v.boosts.filter(b => b.kind !== kind);
      v.boosts.push(makeBoost(kind, e.left, d.ts, 'export', e.key));
    }
  }
}

function setBoost(v, kind, left) {
  v.boosts = v.boosts.filter(b => b.kind !== kind);
  if (left === 0) return;
  if (left == null && BOOSTS[kind].mult) left = HOUR; // a fresh potion
  v.boosts.push(makeBoost(kind, left, Math.floor(now()), 'manual'));
}

// "45m", "1h 20m", "3d 4h", "1:20" (h:m), "90" (minutes). Blank -> null. Returns seconds or NaN.
function parseDur(s) {
  s = String(s || '').trim().toLowerCase();
  if (!s) return null;
  if (/^\d+(\.\d+)?$/.test(s)) return Math.round(parseFloat(s) * 60);
  let m = s.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
  if (m) return (+m[1]) * 3600 + (+m[2]) * 60 + (+(m[3] || 0));
  let total = 0, any = false;
  const re = /(\d+(?:\.\d+)?)\s*(d|h|m|s)[a-z]*/g;
  let rest = s.replace(re, (_, n, u) => { any = true; total += parseFloat(n) * { d: 86400, h: 3600, m: 60, s: 1 }[u]; return ''; });
  return any && !rest.replace(/[\s,]/g, '') ? Math.round(total) : NaN;
}

function windowsFor(v, q) {
  return v.boosts
    .filter(b => BOOSTS[b.kind] && BOOSTS[b.kind].queue === q && BOOSTS[b.kind].mult && b.end != null)
    .map(b => ({ start: b.start, end: b.end, mult: BOOSTS[b.kind].mult }));
}

// Rate at time t = sum of active multipliers (potion 10 + byte 4 = 14), else 1.
function finishTime(v, work, t0, q) {
  const wins = HOME_QUEUES.includes(q) ? windowsFor(v, q) : [];
  const pts = [...new Set(wins.flatMap(w => [w.start, w.end]))].filter(p => p > t0).sort((a, b) => a - b);
  let t = t0, W = work;
  for (let i = 0; i <= pts.length; i++) {
    const next = i < pts.length ? pts[i] : Infinity;
    const mid = next === Infinity ? t + 1 : (t + next) / 2;
    const active = wins.filter(w => w.start <= mid && mid < w.end);
    const r = active.length ? active.reduce((a, w) => a + w.mult, 0) : 1;
    const cap = (next - t) * r;
    if (W <= cap) return t + W / r;
    W -= cap; t = next;
  }
  return t;
}

// Product of the time cuts active at time t for queue q (Welcome Back × Hammer Jam × Gold Pass).
function cutFactor(v, q, t) {
  if (!HOME_QUEUES.includes(q)) return 1;
  return activeBoosts(v, t).reduce((f, b) => f * ((BOOSTS[b.kind].cut || {})[q] || 1), 1);
}

// ---------- formatting ----------
function fmtDur(s) {
  s = Math.max(0, Math.round(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  if (d) return `${d}d ${h}h ${m}m`;
  if (h) return `${h}h ${m}m ${String(sec).padStart(2, '0')}s`;
  if (m) return `${m}m ${String(sec).padStart(2, '0')}s`;
  return `${sec}s`;
}
function fmtShort(s) {
  if (s <= 0) return 'ended';
  s = Math.round(s);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return `${d}d ${h}h`;
  if (h) return `${h}h ${m}m`;
  return `${m || 1}m`;
}
function fmtAgo(s) {
  s = Math.max(0, s);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m ago`;
  return `${Math.floor(s / 86400)}d ${Math.floor(s % 86400 / 3600)}h ago`;
}
function fmtWhen(t) {
  const d = new Date(t * 1000), today = new Date();
  const tmrw = new Date(today); tmrw.setDate(today.getDate() + 1);
  const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === today.toDateString()) return `Today ${time}`;
  if (d.toDateString() === tmrw.toDateString()) return `Tomorrow ${time}`;
  return d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + time;
}
const nameOf = task => state.names[task.nameKey] || NAMES[task.id] || `Unknown item #${task.id}`;

// ---------- computed timers ----------
function tasksFor(v) {
  const d = P(v);
  return d.tasks.map(t => {
    const work = v.applyCurrent ? t.timer * Math.min(cutFactor(v, t.queue, d.ts), cutFactor(v, t.queue, now())) : t.timer;
    const fin = finishTime(v, work, d.ts, t.queue);
    return { ...t, v, fin, saved: d.ts + t.timer - fin };
  });
}
function shownVillages() {
  if (state.view !== 'all') return [state.villages[state.view]].filter(Boolean);
  const pick = state.vfilter.filter(t => state.villages[t]);
  return pick.length ? pick.map(t => state.villages[t]) : villages();
}
function allTasks() { return shownVillages().flatMap(tasksFor); }
// Village-level sorts only mean something when several villages are listed.
const effectiveSort = () => state.view !== 'all' && ['recent', 'village'].includes(state.sort) ? 'soonest' : state.sort;

function sortTasks(list) {
  const by = {
    soonest: (a, b) => a.fin - b.fin,
    latest: (a, b) => b.fin - a.fin,
    recent: (a, b) => P(b.v).ts - P(a.v).ts || a.fin - b.fin,
    village: (a, b) => vname(a.v).localeCompare(vname(b.v)) || a.fin - b.fin,
    name: (a, b) => nameOf(a).localeCompare(nameOf(b)) || a.fin - b.fin,
  }[effectiveSort()] || ((a, b) => a.fin - b.fin);
  return list.slice().sort(by);
}

// ---------- render ----------
function renderHeader() {
  const vs = villages();
  const kb = matchMedia('(pointer: fine)').matches ? ` · ${/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl+'}V anywhere to paste an export` : '';
  $('meta').textContent = `${vs.length} village${vs.length === 1 ? '' : 's'}${kb}`;
}

function villageNext(v) {
  const t = now();
  const running = tasksFor(v).filter(x => x.fin > t).sort((a, b) => a.fin - b.fin);
  return { running, next: running[0] };
}

function activeChips(v) {
  const t = now();
  const list = activeBoosts(v, t).sort((a, b) => (a.end ?? Infinity) - (b.end ?? Infinity));
  if (!list.length) return '';
  return `<div class="achips">${list.map(b =>
    `<span class="achip" style="--c:${boostColor(b.kind)}" title="${esc(BOOSTS[b.kind].desc)}">${esc(BOOSTS[b.kind].short)} · ` +
    `<span data-left="${b.end ?? ''}">${b.end == null ? 'on' : fmtShort(b.end - t)}</span></span>`).join('')}</div>`;
}

function renderTabs() {
  const vs = villages();
  const tab = (id, title, sub, color) =>
    `<button class="vtab ${state.view === id ? 'on' : ''}" data-view="${esc(id)}" ${color ? `style="--c:${color}"` : ''}
      ${id !== 'all' && state.view === id ? 'title="Click again to rename"' : ''}>
      <span class="t">${esc(title)}</span><span class="s">${sub}</span></button>`;
  const allRunning = vs.reduce((n, v) => n + villageNext(v).running.length, 0);
  $('vtabs').innerHTML = tab('all', 'All villages', `${allRunning} running`) +
    vs.map(v => tab(v.tag, vname(v), `export ${fmtAgo(now() - P(v).ts)}`, v.color)).join('');
}

function renderVillageHead() {
  if (state.view === 'all') { $('vhead').innerHTML = ''; return; }
  const v = state.villages[state.view], d = P(v), age = now() - d.ts;
  $('vhead').innerHTML = `<div class="vhead">
    <div class="t nick" data-nick="${esc(v.tag)}" title="Click to rename">${esc(vname(v))}<span class="pen">✎</span>${v.nick ? `<small>${esc(v.tag)}</small>` : ''}</div>
    <div class="row">
      <span class="meta">exported ${fmtWhen(d.ts)} (${fmtAgo(age)})${age > 86400 ? ' <span class="warn">· stale</span>' : ''}${d.hasTs ? '' : ' <span class="warn">· no timestamp in export</span>'}</span>
      <button class="danger sm" data-remove="${esc(v.tag)}">Remove</button>
    </div></div>
    <div class="vboosts">${activeChips(v) || '<span class="meta">No boosts active.</span>'}</div>`;
}

function renderSummary() {
  const t = now();
  if (state.view === 'all') {
    // one card per village
    $('summary').innerHTML = villages().map(v => {
      const { running, next } = villageNext(v);
      return `<div class="card click" data-view="${esc(v.tag)}" style="--c:${v.color}">
        <div class="lbl">${esc(vname(v))}</div>
        <div class="big" data-cd="${next ? next.fin : ''}" data-done="All done">${next ? fmtDur(next.fin - t) : 'All done'}</div>
        <div class="sub">${next ? `next: ${esc(nameOf(next))} · ${running.length} running` : 'nothing running'} · export ${fmtAgo(t - P(v).ts)}</div>
        ${activeChips(v)}
      </div>`;
    }).join('');
    return;
  }
  const v = state.villages[state.view], tasks = tasksFor(v);
  $('summary').innerHTML = HOME_QUEUES.concat(['bb_builder', 'bb_lab']).map(q => {
    const list = tasks.filter(x => x.queue === q);
    if (!list.length && !HOME_QUEUES.includes(q)) return '';
    const running = list.filter(x => x.fin > t).sort((a, b) => a.fin - b.fin), next = running[0];
    return `<div class="card" style="--c:${QUEUES[q].color}">
      <div class="lbl">${QUEUES[q].icon} ${QUEUES[q].label}</div>
      <div class="big" data-cd="${next ? next.fin : ''}" data-done="Done">${next ? fmtDur(next.fin - t) : (list.length ? 'All done' : 'Idle')}</div>
      <div class="sub">${next ? `next: ${esc(nameOf(next))} · ${running.length} running` : (list.length ? `${list.length} ready to collect` : 'nothing upgrading')}</div>
    </div>`;
  }).join('');
}

function boostStatus(b) {
  const t = now();
  if (!b) return `<span class="bs">Off</span>`;
  const src = b.src === 'export' ? '<span class="src">from export</span>' : '';
  if (t < b.start) return `<span class="bs">starts in ${fmtDur(b.start - t)}${src}</span>`;
  if (b.end == null) return `<span class="bs on">Active · no end set${src}</span>`;
  if (t < b.end) return `<span class="bs on">Active · <span data-left="${b.end}">${fmtDur(b.end - t)}</span> left<br><span class="meta">ends ${fmtWhen(b.end)}</span>${src}</span>`;
  return `<span class="bs">Ended ${fmtAgo(t - b.end)}${src}</span>`;
}

function renderBoosts(v) {
  const t = now();
  const exp = exportEntries(v);
  const fromExport = kind => exp.find(e => exportKindsFor(e.map).includes(kind));
  const row = kind => {
    const B = BOOSTS[kind], b = boostOf(v, kind), on = b && isActive(b, t), e = fromExport(kind);
    const ph = B.mult ? '1h' : 'no end';
    return `<div class="brow ${on ? 'on' : ''}" style="--c:${boostColor(kind)}">
      <div><div class="bn">${B.label}</div><div class="bd">${B.desc}</div></div>
      <div>${boostStatus(b)}</div>
      <div class="row bc">
        <input class="dur" data-dur="${kind}" placeholder="time left · ${ph}" title="e.g. 45m, 1h 20m, 3d 4h, 1:20. Blank = ${B.mult ? 'a fresh 1 hour' : 'no end'}">
        <button class="sm" data-set="${kind}">Set</button>
        ${b ? `<button class="sm ghost" data-clear="${kind}">Clear</button>` : ''}
        ${e && P(v).ts + e.left > t ? `<button class="sm ghost" data-fromexp="${esc(e.key)}" title="Overwrite with the export value">Use export (${fmtShort(P(v).ts + e.left - t)} left)</button>` : ''}
      </div></div>`;
  };
  const kindOpts = sel => ['potion', 'byte', 'both', 'lab_potion', 'study_soup', 'pet_potion', 'ignore'].map(k =>
    `<option value="${k}" ${sel === k ? 'selected' : ''}>${k === 'both' ? 'Builder Potion + Byte (14×)' : k === 'ignore' ? 'Ignore' : `${BOOSTS[k].label} (${BOOSTS[k].mult}×)`}</option>`).join('');
  const expHtml = `<div class="expmap">
    <div class="row" style="justify-content:space-between;margin:0">
      <b>From the export file</b>
      ${exp.length ? '<button class="sm" data-fromexp="*">Re-read all from export</button>' : ''}
    </div>
    ${exp.length ? exp.map(e => `<div class="row">
        <code>${esc(e.key)}</code> <span class="meta">${fmtDur(e.left)} left at export (${P(v).ts + e.left > t ? fmtShort(P(v).ts + e.left - t) + ' left now' : 'ended'})</span>
        <span class="meta">→ treat as</span> <select data-expmap="${esc(e.key)}">${kindOpts(e.map)}</select></div>`).join('')
      : '<div class="hint" style="margin-top:4px">This export lists no running boosts.</div>'}
    <div class="hint">Pasting a new export overwrites the boosts it lists. Time cuts aren't in the export, so set those here.</div>
    <div class="row" style="margin-top:10px"><label class="tog"><input type="checkbox" data-applycur ${v.applyCurrent ? 'checked' : ''}> Apply time cuts to upgrades already running</label></div>
    <div class="hint">Off by default: the game bakes cuts into an upgrade when it starts, so they normally only change the planner.</div>
  </div>`;
  $('boosts').innerHTML = BOOST_GROUPS.map(([title, kinds]) =>
    `<div class="bgroup">${title}</div>${kinds.map(row).join('')}`).join('') + expHtml;
}

function renderChips(tasks) {
  const present = ['all', ...Object.keys(QUEUES).filter(q => tasks.some(t => t.queue === q))];
  if (!present.includes(state.filter)) state.filter = 'all';
  $('chips').innerHTML = present.map(q => {
    const n = q === 'all' ? tasks.length : tasks.filter(t => t.queue === q).length;
    return `<button class="chip ${state.filter === q ? 'on' : ''}" data-filter="${q}" aria-pressed="${state.filter === q}">${q === 'all' ? 'Everything' : `${QUEUES[q].icon} ${QUEUES[q].label}`} · ${n}</button>`;
  }).join('');
}

// Village filter (All view): pick any number of villages; none picked = all of them.
function renderVillageChips() {
  const vs = villages();
  state.vfilter = state.vfilter.filter(t => state.villages[t]);
  const all = !state.vfilter.length;
  $('vchips').innerHTML = `<button class="chip ${all ? 'on' : ''}" data-vfall aria-pressed="${all}">All villages</button>` +
    vs.map(v => {
      const on = state.vfilter.includes(v.tag);
      return `<button class="chip ${on ? 'on' : ''}" data-vf="${esc(v.tag)}" aria-pressed="${on}" style="--c:${v.color}"><span class="dot"></span>${esc(vname(v))}</button>`;
    }).join('');
}

function timerRow(x, showVillage) {
  const t = now(), done = x.fin <= t;
  const badges = [];
  if (showVillage) badges.push(`<span class="badge v" style="--vc:${x.v.color}">${esc(vname(x.v))}</span>`);
  badges.push(`<span class="badge q" style="--c:${QUEUES[x.queue].color}">${QUEUES[x.queue].label}</span>`);
  if (x.extra) badges.push(`<span class="badge" title="Marked extra:true in the export, likely a goblin builder/researcher slot">extra slot</span>`);
  if (x.saved > 30) badges.push(`<span class="badge boost">−${fmtDur(x.saved)} from boosts${x.v.applyCurrent ? '/cuts' : ''}</span>`);
  return `<div class="timer ${done ? 'done' : ''}" style="--c:${showVillage ? x.v.color : QUEUES[x.queue].color}">
    <div class="bar" title="${QUEUES[x.queue].label}">${QUEUES[x.queue].icon}</div>
    <div>
      <div class="nm" data-rename="${esc(x.nameKey)}" title="Click to rename">${esc(nameOf(x))}</div>
      <div class="info"><span class="lvl">Lvl ${esc(x.lvl)} → ${esc(x.lvl + 1)}</span> ${badges.join('')}</div>
    </div>
    <div class="right">
      <div class="cd" data-cd="${x.fin}" data-done="Ready!">${done ? 'Ready!' : fmtDur(x.fin - t)}</div>
      <div class="fin">${done ? 'finished ' : 'done '}${fmtWhen(x.fin)}</div>
    </div></div>`;
}

function renderTimers(tasks) {
  const multi = state.view === 'all' && villages().length > 1;
  let list = state.filter === 'all' ? tasks : tasks.filter(t => t.queue === state.filter);
  list = sortTasks(list);
  const nv = new Set(list.map(x => x.v.tag)).size;
  $('showing').textContent = villages().length ? `${list.length} upgrade${list.length === 1 ? '' : 's'}${state.view === 'all' ? ` in ${nv} village${nv === 1 ? '' : 's'}` : ''}` : '';
  if (!list.length) {
    const filtered = state.filter !== 'all' || (state.view === 'all' && state.vfilter.length);
    $('timers').innerHTML = !villages().length
      ? '<div class="empty">No villages in your account yet. Copy an export from the game and paste it here (⌘V / Ctrl+V), or use <b>+ Paste export</b> at the top. It saves to your account, so every device you sign in on sees it.</div>'
      : filtered ? '<div class="empty">No upgrades match these filters. <button class="ghost sm" data-clearfilters>Show everything</button></div>'
      : '<div class="empty">Nothing upgrading right now. Paste a fresh export after you start new upgrades.</div>';
    return;
  }

  const group = state.view === 'all' ? state.groupBy : (state.groupBy === 'queue' ? 'queue' : 'none');
  if (group === 'none') { $('timers').innerHTML = list.map(x => timerRow(x, multi)).join(''); return; }

  const groups = new Map();
  for (const x of list) {
    const k = group === 'village' ? x.v.tag : x.queue;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(x);
  }
  let keys = [...groups.keys()];
  if (group === 'village') {
    const vt = k => state.villages[k];
    // Village groups follow the sort: newest export, A–Z, or (for time/name sorts) the order of their first upgrade.
    if (state.sort === 'recent') keys.sort((a, b) => P(vt(b)).ts - P(vt(a)).ts);
    else if (state.sort === 'village') keys.sort((a, b) => vname(vt(a)).localeCompare(vname(vt(b))));
  } else {
    keys.sort((a, b) => Object.keys(QUEUES).indexOf(a) - Object.keys(QUEUES).indexOf(b));
  }
  $('timers').innerHTML = keys.map(k => {
    const items = groups.get(k);
    let head;
    if (group === 'village') {
      const v = state.villages[k];
      head = `<div class="group-h" style="--c:${v.color}"><span class="nick" data-nick="${esc(v.tag)}" title="Click to rename">${esc(vname(v))}<span class="pen">✎</span></span>
        <span class="meta">${items.length} upgrade${items.length > 1 ? 's' : ''} · export ${fmtAgo(now() - P(v).ts)}</span></div>`;
    } else {
      head = `<div class="group-h" style="--c:${QUEUES[k].color}">${QUEUES[k].icon} ${QUEUES[k].label}<span class="meta">${items.length}</span></div>`;
    }
    return head + items.map(x => timerRow(x, multi && group !== 'village')).join('');
  }).join('');
}

function renderPlanner() {
  if (state.view === 'all') return;
  const v = state.villages[state.view], q = $('pq').value;
  const num = id => Math.max(0, +$(id).value || 0);
  const base = num('pd') * 86400 + num('ph') * 3600 + num('pm') * 60;
  if (!base) { $('planOut').innerHTML = '<span class="meta">Enter the upgrade’s base time from the game or wiki.</span>'; return; }
  const t = now(), f = cutFactor(v, q, t), work = base * f;
  const fin = finishTime(v, work, t, q);
  $('planOut').innerHTML =
    `Takes <b>${fmtDur(fin - t)}</b>, done <b>${fmtWhen(fin)}</b> <span class="meta">(after time cuts ×${+f.toFixed(3)}: ${fmtDur(work)} of work, then speed boosts)</span>`;
}

let lastRender = 0;
function render() {
  lastRender = now();
  renderHeader();
  // The hub always shows, even with no villages yet; pasting is never forced.
  $('app').hidden = false;
  if (state.view !== 'all' && !state.villages[state.view]) state.view = 'all';
  const single = state.view !== 'all';
  // keep focus/typing in a boost input across re-renders
  const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.dur;
  const typed = focused ? document.activeElement.value : '';
  const tasks = allTasks();
  renderTabs(); renderVillageHead(); renderSummary();
  $('boostPanel').hidden = !single; $('plannerPanel').hidden = !single;
  $('boosts').hidden = !state.boostsOpen;
  $('boostToggle').textContent = state.boostsOpen ? 'Hide ▴' : 'Manage boosts ▾';
  $('boostToggle').setAttribute('aria-expanded', state.boostsOpen);
  if (single) { if (state.boostsOpen) renderBoosts(state.villages[state.view]); renderPlanner(); }
  if (focused) { const el = document.querySelector(`[data-dur="${focused}"]`); if (el) { el.value = typed; el.focus(); } }
  $('groupCtl').hidden = single;
  $('vfilterRow').hidden = single || villages().length < 2;
  for (const o of $('sortBy').options) o.hidden = single && 'multi' in o.dataset;
  $('groupBy').value = state.groupBy; $('sortBy').value = effectiveSort();
  $('timersTitle').textContent = single ? 'Upgrades in progress' : 'All upgrades in progress';
  if (!single) renderVillageChips();
  renderChips(tasks); renderTimers(tasks);
}

// Cheap per-second tick: only update countdown text.
function tick() {
  if (!villages().length) return;
  const t = now();
  document.querySelectorAll('[data-cd]').forEach(el => {
    const fin = +el.dataset.cd;
    if (fin) el.textContent = fin <= t ? el.dataset.done : fmtDur(fin - t);
  });
  document.querySelectorAll('[data-left]').forEach(el => {
    const end = +el.dataset.left;
    if (end) el.textContent = el.closest('.achip') ? fmtShort(end - t) : fmtDur(end - t);
  });
  // Full re-render every 30s (order, boost states, "ago" labels) and as soon as something finishes,
  // but not while a dropdown is open, which a re-render would close.
  const passed = x => x > lastRender && x <= t; // finished since the last render
  const crossed = [...document.querySelectorAll('[data-cd]')].some(el => passed(+el.dataset.cd))
    || [...document.querySelectorAll('[data-left]')].some(el => passed(+el.dataset.left));
  if ((crossed || t - lastRender >= 30) && document.activeElement?.tagName !== 'SELECT') render();
}

// ---------- loading exports ----------
function showPaste(on) {
  $('pastePanel').hidden = !on;
  $('cancelPaste').hidden = false;
  $('err').textContent = '';
  if (on) { $('raw').value = ''; $('raw').focus(); }
}

function loadRaw(raw, isRetry) {
  raw = raw.trim();
  const next = parseExport(raw);
  const tag = next.tag;
  let v = state.villages[tag];
  const isNew = !v;
  if (v && next.ts < P(v).ts && !confirm(`This export of ${vname(v)} is older than the one loaded. Load it anyway?`)) return;
  if (isNew) {
    const used = new Set(villages().map(x => x.color));
    v = state.villages[tag] = {
      tag, nick: '', raw, boosts: [], exportMap: {}, applyCurrent: false, schema: 3,
      color: VILLAGE_COLORS.find(c => !used.has(c)) || VILLAGE_COLORS[villages().length % VILLAGE_COLORS.length],
    };
  }
  v.raw = raw;
  if (next.hasTs) delete v.loadedAt; else v.loadedAt = next.ts; // no timestamp: count from paste time
  parsed[tag] = next;
  // Speed boosts that ended before this export are already reflected in its timers. The previous export's
  // boosts are superseded, and hand-set speed boosts on a queue the export reports are dropped so they
  // aren't counted twice. Then the export's own values are written in.
  const covered = new Set(exportEntries(v).flatMap(e => exportKindsFor(e.map)).map(k => BOOSTS[k].queue));
  v.boosts = v.boosts.filter(b => {
    const B = BOOSTS[b.kind];
    if (!B) return false;
    if (b.src === 'export') return false;
    if (B.mult && b.end != null && b.end <= next.ts) return false;
    if (B.mult && b.start <= next.ts && covered.has(B.queue)) return false;
    return true;
  });
  applyExport(v);
  state.view = tag;
  // If another device saved this village in the meantime, reload and apply the paste on top once.
  syncVillage(v, isRetry ? undefined : () => { try { loadRaw(raw, true); } catch (e) {} });
  save(); showPaste(false); render();
  toast(`${isNew ? 'Added new village' : 'Updated'} ${vname(v)} · export ${fmtWhen(next.ts)} · ${next.tasks.length} upgrades running`);
}

$('loadBtn').onclick = () => {
  try { loadRaw($('raw').value); }
  catch (e) { $('err').textContent = 'Could not read that: ' + e.message; }
};
$('cancelPaste').onclick = () => showPaste(false);
// Pasting into the box loads straight away; typing still uses the button.
$('raw').addEventListener('paste', e => {
  const text = e.clipboardData.getData('text');
  if (!text.trim().startsWith('{')) return;
  e.preventDefault();
  $('raw').value = text;
  try { loadRaw(text); } catch (err) { $('err').textContent = 'Could not read that: ' + err.message; }
});
$('boostToggle').onclick = () => { state.boostsOpen = !state.boostsOpen; save(); render(); };
$('repaste').onclick = () => showPaste(true);

// Cmd/Ctrl+V anywhere on the page (outside a text field) loads an export straight from the clipboard.
document.addEventListener('paste', e => {
  if (e.target.closest('textarea, input')) return;
  const text = e.clipboardData.getData('text');
  if (!text.trim().startsWith('{')) return;
  e.preventDefault();
  try { loadRaw(text); }
  catch (err) { toast('Clipboard is not a valid export: ' + err.message, true); }
});

function toast(msg, bad) {
  const el = $('toast');
  el.textContent = msg; el.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.className = 'toast', 3500);
}

// ---------- interactions ----------
function renameVillage(tag) {
  const t = state.villages[tag];
  if (!t) return;
  const val = prompt(`Nickname for ${t.tag} (blank uses the tag):`, t.nick);
  if (val === null) return;
  t.nick = val.trim();
  syncVillage(t); render();
  toast(t.nick ? `${t.tag} is now “${t.nick}”` : `${t.tag} nickname cleared`);
}

function setFromInput(v, kind) {
  const input = document.querySelector(`[data-dur="${kind}"]`);
  const left = parseDur(input ? input.value : '');
  if (Number.isNaN(left)) { toast('Could not read that time. Try 45m, 1h 20m or 3d 4h.', true); return false; }
  setBoost(v, kind, left);
  syncVillage(v);
  const b = boostOf(v, kind);
  toast(`${BOOSTS[kind].label} set${b && b.end != null ? `: ${fmtShort(b.end - now())} left` : ' with no end'}`);
  return true;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-view],[data-set],[data-clear],[data-fromexp],[data-filter],[data-vf],[data-vfall],[data-clearfilters],[data-rename],[data-nick],[data-remove]');
  if (!el) return;
  const v = state.villages[state.view];
  if (el.dataset.nick) {
    renameVillage(el.dataset.nick);
    return;
  } else if (el.dataset.view && el.dataset.view !== 'all' && el.dataset.view === state.view && el.classList.contains('vtab')) {
    renameVillage(el.dataset.view); // clicking the tab you're already on renames it
    return;
  } else if (el.dataset.view) {
    state.view = el.dataset.view;
  } else if (el.dataset.set && v) {
    if (!setFromInput(v, el.dataset.set)) return;
  } else if (el.dataset.clear && v) {
    setBoost(v, el.dataset.clear, 0);
    syncVillage(v);
  } else if (el.dataset.fromexp && v) {
    applyExport(v, el.dataset.fromexp === '*' ? undefined : el.dataset.fromexp);
    syncVillage(v);
    toast('Boosts re-read from the export');
  } else if ('vfall' in el.dataset) {
    state.vfilter = [];
  } else if (el.dataset.vf) {
    const tag = el.dataset.vf, i = state.vfilter.indexOf(tag);
    if (i >= 0) state.vfilter.splice(i, 1); else state.vfilter.push(tag);
    if (state.vfilter.length === villages().length) state.vfilter = []; // every village picked = all
  } else if ('clearfilters' in el.dataset) {
    state.filter = 'all'; state.vfilter = [];
  } else if (el.dataset.filter) {
    state.filter = el.dataset.filter;
  } else if (el.dataset.rename) {
    const k = el.dataset.rename;
    const val = prompt('Name for this item (blank resets):', state.names[k] || el.textContent);
    if (val === null) return;
    if (val.trim()) state.names[k] = val.trim(); else delete state.names[k];
    syncName(k, val.trim());
  } else if (el.dataset.remove) {
    const t = state.villages[el.dataset.remove];
    if (!confirm(`Remove ${vname(t)} and its saved export from your account? Pasting its export again brings it back.`)) return;
    delete state.villages[t.tag]; delete parsed[t.tag]; state.view = 'all';
    syncRemove(t.tag);
  } else return;
  save(); render();
});

document.addEventListener('keydown', e => {
  const kind = e.target.dataset && e.target.dataset.dur;
  if (kind && e.key === 'Enter') {
    const v = state.villages[state.view];
    if (v && setFromInput(v, kind)) { e.target.value = ''; render(); }
  }
});

document.addEventListener('change', e => {
  const el = e.target, v = state.villages[state.view];
  if (el.id === 'groupBy') state.groupBy = el.value;
  else if (el.id === 'sortBy') state.sort = el.value;
  else if (el.dataset.expmap && v) { v.exportMap[el.dataset.expmap] = el.value; applyExport(v, el.dataset.expmap); syncVillage(v); }
  else if ('applycur' in el.dataset && v) { v.applyCurrent = el.checked; syncVillage(v); }
  else return;
  save(); render();
});
['pq', 'pd', 'ph', 'pm'].forEach(id => $(id).addEventListener('input', renderPlanner));

$('logout').onclick = async () => {
  await api('POST', '/api/logout', {}).catch(() => {});
  location.href = '/login';
};

// Pick up changes made on other devices when this tab comes back into view, and once a minute.
async function refresh() {
  if (pending || document.hidden) return;
  const a = document.activeElement;
  if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
  try { await pull(); render(); } catch (e) {}
}
document.addEventListener('visibilitychange', refresh);
setInterval(refresh, 60000);

// ---------- boot ----------
(async () => {
  try {
    const me = await api('GET', '/api/me');
    $('who').textContent = me.display;
    NAMES = await api('GET', '/game-names.json').catch(() => ({}));
    await pull();
    await migrateLocal();
  } catch (e) {
    if (e.message === 'Signed out') return;
    toast('Could not load your villages: ' + e.message, true);
  }
  setSync();
  render();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
