<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Upgrade Timers</title>
<style>
  :root { --bg:#12141a; --panel:#1b1e27; --line:#2e3342; --text:#e8e9ee; --muted:#9298aa; --gold:#f2c14e; --danger:#ff7a7a; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  form { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 18px; font-size: 20px; }
  h1 span { color: var(--gold); }
  label { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 12px 0 5px; }
  input {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 12px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--gold); }
  button {
    width: 100%; margin-top: 20px; padding: 10px; border-radius: 8px; border: 1px solid var(--gold);
    background: var(--gold); color: #1a1406; font: inherit; font-weight: 650; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Village <span>Upgrade Timers</span></h1>
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autocapitalize="none" autofocus required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <button id="b">Sign in</button>
  <div class="err" id="err"></div>
</form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }),
    });
    if (r.ok) { location.href = '/'; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || 'Sign in failed';
  } catch (x) { err.textContent = 'Could not reach the server'; }
  b.disabled = false;
});
</script>
</body>
</html>
